name: Bug report
description: Something in a tool or page does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not attach private files, screenshots of private documents, passwords or hidden messages.** Use a test file you are happy to share publicly, or describe it instead.

        If the problem could expose user content (for example, a file or result leaving the browser), report it privately as described in SECURITY.md instead.
  - type: dropdown
    id: tool
    attributes:
      label: Tool or page
      options:
        - Extract text (image OCR)
        - PDF to text
        - Hide or reveal a message
        - Media Inspector
        - Guide or information page
        - Offline use or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose a PNG of ...
        3. Select ...
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 144 on Windows 11, Safari on iOS 26, ...
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Error messages
      description: Any error shown on the page or in the browser console. Remove any personal content first.
      render: text
